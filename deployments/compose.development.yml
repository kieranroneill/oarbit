services:
  api:
    build:
      context: ../
      dockerfile: ./build/package/api/Dockerfile.development
    container_name: oarbit_api_dev
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-3000}
      DESCRIPTION: ${DESCRIPTION:-"Oarbit is an onboard knowledge and maintenance copilot that centralizes technical documents, service logs, and operational notes for your vessel."}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      POSTGRES_DB: ${POSTGRES_DB:-oarbit}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      TITLE: ${TITLE:-Oarbit}
    image: kieranroneill/oarbit-api:development
    networks:
      - oarbit_network_dev
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - ../cmd:/app/cmd:cached
      - ../internal:/app/internal:cached

  migrations_down:
    build:
      context: ../
      dockerfile: ./build/package/migrations/Dockerfile
    command: ['goose', '--dir', 'migrations', 'down']
    container_name: oarbit_migrations_down_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-oarbit}?sslmode=disable'
    image: kieranroneill/oarbit-migrations-down:development
    networks:
      - oarbit_network_dev
    profiles: ['migration']
    volumes:
      - ../migrations:/app/migrations:ro

  migrations_up:
    build:
      context: ../
      dockerfile: ./build/package/migrations/Dockerfile
    command: ['goose', '--dir', 'migrations', 'up']
    container_name: oarbit_migrations_up_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-oarbit}?sslmode=disable'
    image: kieranroneill/oarbit-migrations-up:development
    networks:
      - oarbit_network_dev
    profiles: ['migration']
    volumes:
      - ../migrations:/app/migrations:ro

  ollama:
    build:
      context: ../
      dockerfile: ./build/package/ollama/Dockerfile.development
    container_name: oarbit_ollama_dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:11434/api/tags']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    image: kieranroneill/oarbit-ollama:development
    networks:
      - oarbit_network_dev
    ports:
      - '11434:11434'
    volumes:
      - ../.ollama:/root/.ollama

  postgres:
    container_name: oarbit_postgres_dev
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oarbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -d ${POSTGRES_DB:-oarbit} -U ${POSTGRES_USER:-postgres}' ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oarbit_network_dev
    ports:
      - '${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}'
    volumes:
      - ../.postgres:/var/lib/postgresql/data

  web:
    build:
      context: ../
      dockerfile: ./build/package/web/Dockerfile.development
    container_name: oarbit_web_dev
    depends_on:
      - api
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
      NODE_ENV: ${ENVIRONMENT:-development}
      VITE_DESCRIPTION: ${DESCRIPTION:-"Oarbit is an onboard knowledge and maintenance copilot that centralizes technical documents, service logs, and operational notes for your vessel."}
      VITE_LOG_LEVEL: ${LOG_LEVEL:-debug}
      VITE_TITLE: ${TITLE:-Oarbit}
    image: kieranroneill/oarbit-web:development
    networks:
      - oarbit_network_dev
    ports:
      - '8080:8080'
    volumes:
      # watch for changes on web source code
      - ../web:/app/web:cached
      - ../package.json:/app/package.json:cached
      - ../pnpm-lock.yaml:/app/pnpm-lock.yaml:cached

networks:
  oarbit_network_dev:
    name: oarbit_network_dev
