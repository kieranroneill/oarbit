services:
  api:
    build:
      context: ../
      dockerfile: ./build/package/api/Dockerfile.development
    container_name: oarbit_api_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      POSTGRES_DB: ${POSTGRES_DB:-oarbit}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      TITLE: ${TITLE:-Oarbit}
    image: kieranroneill/oarbit-api:development
    networks:
      - oarbit_network_dev
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - ../cmd:/app/cmd:cached
      - ../internal:/app/internal:cached

