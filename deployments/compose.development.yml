  postgres:
    container_name: oarbit_postgres_dev
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oarbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -d ${POSTGRES_DB:-oarbit} -U ${POSTGRES_USER:-postgres}' ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oarbit_network_dev
    ports:
      - '${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}'
    volumes:
      - ../.postgres:/var/lib/postgresql/data

